<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="Georgia, 'Times New Roman', serif" xml:space="preserve">

  <rect width="640" height="410" fill="#fafaf8"/>

  <defs>
    <marker id="cy-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2c3e50"/>
    </marker>
    <marker id="cy-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a0522d"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c2c2c">Iterative Subspace Diagonalisation Cycle</text>
  <text x="320" y="47" text-anchor="middle" font-size="11.5" fill="#555" font-style="italic">Solve m × m projected eigenproblem inside subspace 𝒱<tspan font-size="8.5" dy="2">m</tspan><tspan dy="-2"> (m ~ 2 N</tspan><tspan font-size="8.5" dy="2">bands</tspan><tspan dy="-2"> ≪ N</tspan><tspan font-size="8.5" dy="2">PW</tspan><tspan dy="-2">)</tspan></text>

  <!-- Step 1: Project and diagonalise (top-left) -->
  <rect x="36" y="70" width="248" height="84" rx="8" fill="#4a7fa5" fill-opacity="0.14" stroke="#4a7fa5" stroke-width="2"/>
  <text x="160" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5f85">1. Project &amp; Diagonalise</text>
  <text x="160" y="114" text-anchor="middle" font-size="12" fill="#2c2c2c">H<tspan font-size="8.5" dy="2">ij</tspan><tspan dy="-2"> = ⟨v</tspan><tspan font-size="8.5" dy="2">i</tspan><tspan dy="-2">|ĥ</tspan><tspan font-size="8.5" dy="2">KS</tspan><tspan dy="-2">|v</tspan><tspan font-size="8.5" dy="2">j</tspan><tspan dy="-2">⟩,  S</tspan><tspan font-size="8.5" dy="2">ij</tspan><tspan dy="-2"> = ⟨v</tspan><tspan font-size="8.5" dy="2">i</tspan><tspan dy="-2">|v</tspan><tspan font-size="8.5" dy="2">j</tspan><tspan dy="-2">⟩</tspan></text>
  <text x="160" y="136" text-anchor="middle" font-size="11.5" fill="#555">Solve m × m problem  O(m<tspan font-size="8.5" dy="-3">3</tspan><tspan dy="3">)</tspan></text>

  <!-- Step 2: Compute residuals (top-right) -->
  <rect x="356" y="70" width="248" height="84" rx="8" fill="#6a9e7a" fill-opacity="0.15" stroke="#6a9e7a" stroke-width="2"/>
  <text x="480" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#436e50">2. Compute Residuals</text>
  <text x="480" y="114" text-anchor="middle" font-size="12" fill="#2c2c2c">|r<tspan font-size="8.5" dy="2">i</tspan><tspan dy="-2">⟩ = (ĥ</tspan><tspan font-size="8.5" dy="2">KS</tspan><tspan dy="-2"> − ε</tspan><tspan font-size="8.5" dy="2">i</tspan><tspan dy="-2">)|ψ</tspan><tspan font-size="8.5" dy="2">i</tspan><tspan dy="-2">⟩</tspan></text>
  <text x="480" y="136" text-anchor="middle" font-size="11.5" fill="#555">FFT batch action  O(N<tspan font-size="8.5" dy="2">PW</tspan><tspan dy="-2"> log N</tspan><tspan font-size="8.5" dy="2">PW</tspan><tspan dy="-2">)</tspan></text>

  <!-- Step 3: Kinetic preconditioner (bottom-right) -->
  <rect x="356" y="242" width="248" height="84" rx="8" fill="#7a5c8a" fill-opacity="0.14" stroke="#7a5c8a" stroke-width="2"/>
  <text x="480" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#5d426c">3. Kinetic Preconditioner</text>
  <text x="480" y="286" text-anchor="middle" font-size="12" fill="#2c2c2c">|t<tspan font-size="8.5" dy="2">i</tspan><tspan dy="-2">(G)⟩ = P(G)|r</tspan><tspan font-size="8.5" dy="2">i</tspan><tspan dy="-2">(G)⟩</tspan></text>
  <text x="480" y="308" text-anchor="middle" font-size="11.5" fill="#555">Damps high-G error (~ ½|k+G|<tspan font-size="8.5" dy="-3">2</tspan><tspan dy="3"> − ε</tspan><tspan font-size="8.5" dy="2">i</tspan><tspan dy="-2">)</tspan></text>

  <!-- Step 4: Expand / DIIS update (bottom-left) -->
  <rect x="36" y="242" width="248" height="84" rx="8" fill="#b8963e" fill-opacity="0.15" stroke="#b8963e" stroke-width="2"/>
  <text x="160" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a">4. Subspace / Trial Update</text>
  <text x="160" y="286" text-anchor="middle" font-size="12" fill="#2c2c2c">𝒱<tspan font-size="8.5" dy="2">m</tspan><tspan dy="-2"> ← 𝒱</tspan><tspan font-size="8.5" dy="2">m</tspan><tspan dy="-2"> ⊕ span{|t</tspan><tspan font-size="8.5" dy="2">i</tspan><tspan dy="-2">⟩}</tspan></text>
  <text x="160" y="308" text-anchor="middle" font-size="11.5" fill="#555">Davidson: orthogonalise  |  DIIS: min ‖∑c<tspan font-size="8.5" dy="2">k</tspan><tspan dy="-2">r</tspan><tspan font-size="8.5" dy="-3">(k)</tspan><tspan dy="3">‖</tspan></text>

  <!-- Cycle Arrows -->
  <line x1="286" y1="112" x2="350" y2="112" stroke="#2c3e50" stroke-width="2" marker-end="url(#cy-arr)"/>
  <text x="320" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">|ψ<tspan font-size="8" dy="2">i</tspan><tspan dy="-2">⟩, ε</tspan><tspan font-size="8" dy="2">i</tspan></text>

  <line x1="480" y1="156" x2="480" y2="236" stroke="#2c3e50" stroke-width="2" marker-end="url(#cy-arr)"/>
  <rect x="440" y="185" width="80" height="22" rx="10" fill="#fafaf8" stroke="#2c3e50" stroke-width="1.2"/>
  <text x="480" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">‖r<tspan font-size="8" dy="2">i</tspan><tspan dy="-2">‖ &gt; δ</tspan></text>

  <line x1="440" y1="196" x2="386" y2="196" stroke="#a0522d" stroke-width="2" marker-end="url(#cy-ok)"/>
  <text x="415" y="189" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a0522d">≤ δ</text>

  <rect x="206" y="172" width="174" height="48" rx="8" fill="#a0522d" fill-opacity="0.14" stroke="#a0522d" stroke-width="1.8"/>
  <text x="293" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0522d">Converged Eigenpairs</text>
  <text x="293" y="210" text-anchor="middle" font-size="11.5" fill="#2c2c2c">{ε<tspan font-size="8.5" dy="2">ik</tspan><tspan dy="-2">, |φ</tspan><tspan font-size="8.5" dy="2">ik</tspan><tspan dy="-2">⟩} → ρ</tspan><tspan font-size="8.5" dy="2">out</tspan><tspan dy="-2">(r)</tspan></text>

  <line x1="354" y1="284" x2="290" y2="284" stroke="#2c3e50" stroke-width="2" marker-end="url(#cy-arr)"/>
  <text x="320" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#5d426c">|t<tspan font-size="8" dy="2">i</tspan><tspan dy="-2">⟩</tspan></text>

  <line x1="160" y1="240" x2="160" y2="160" stroke="#2c3e50" stroke-width="2" marker-end="url(#cy-arr)"/>
  <text x="150" y="203" text-anchor="end" font-size="11" font-weight="bold" fill="#8a6a1a">next iter.</text>

  <!-- Bottom note -->
  <rect x="36" y="346" width="568" height="46" rx="6" fill="#4a7fa5" fill-opacity="0.09" stroke="#4a7fa5" stroke-width="1.2"/>
  <text x="320" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Outer tolerance slaving:  δ ~ 10<tspan font-size="8.5" dy="-3">−2</tspan><tspan dy="3">–10</tspan><tspan font-size="8.5" dy="-3">−3</tspan><tspan dy="3"> × EDIFF   (3–6 inner cycles per SCF step)</tspan></text>
  <text x="320" y="383" text-anchor="middle" font-size="11.5" fill="#555">Hybrid strategy: initial Davidson steps prevent band-subspace collapse, then RMM-DIIS cuts O(N<tspan font-size="8.5" dy="-3">2</tspan><tspan dy="3">) orthogonalisation</tspan></text>

</svg>
