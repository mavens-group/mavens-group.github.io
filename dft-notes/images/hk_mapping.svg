<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="Georgia, 'Times New Roman', serif" xml:space="preserve">

  <rect width="640" height="380" fill="#fafaf8"/>

  <defs>
    <marker id="arr-fwd" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2c3e50"/>
    </marker>
    <marker id="arr-inv" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#a0522d"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2c2c2c">The Hohenberg–Kohn Bijection</text>
  <text x="320" y="50" text-anchor="middle" font-size="12" fill="#555" font-style="italic">Unique one-to-one mapping between potential, many-body wavefunction, and density</text>

  <!-- Card 1: External potential -->
  <rect x="30" y="106" width="164" height="106" rx="10" fill="#4a7fa5" fill-opacity="0.14" stroke="#4a7fa5" stroke-width="2"/>
  <text x="112" y="136" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2a5f85">External Potential</text>
  <text x="112" y="164" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c2c2c" font-style="italic">V<tspan font-size="10.5" dy="3" font-style="normal">ext</tspan><tspan dy="-3" font-style="normal">(r)</tspan></text>
  <text x="112" y="192" text-anchor="middle" font-size="11.5" fill="#555">(up to additive constant)</text>

  <!-- Card 2: Many-body wavefunction -->
  <rect x="238" y="106" width="164" height="106" rx="10" fill="#7a5c8a" fill-opacity="0.14" stroke="#7a5c8a" stroke-width="2"/>
  <text x="320" y="136" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#5d426c">Ground State</text>
  <text x="320" y="164" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c2c2c">|Ψ<tspan font-size="10.5" dy="3">0</tspan><tspan dy="-3">⟩</tspan></text>
  <text x="320" y="192" text-anchor="middle" font-size="11.5" fill="#555">3N spatial coordinates</text>

  <!-- Card 3: Electron density -->
  <rect x="446" y="106" width="164" height="106" rx="10" fill="#6a9e7a" fill-opacity="0.16" stroke="#6a9e7a" stroke-width="2"/>
  <text x="528" y="136" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#436e50">Ground-State Density</text>
  <text x="528" y="164" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c2c2c">ρ<tspan font-size="10.5" dy="3">0</tspan><tspan dy="-3">(r)</tspan></text>
  <text x="528" y="192" text-anchor="middle" font-size="11.5" fill="#555">3 spatial coordinates</text>

  <!-- Forward arrows -->
  <line x1="196" y1="159" x2="233" y2="159" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr-fwd)"/>
  <text x="215" y="92" text-anchor="middle" font-size="11.5" fill="#2c3e50" font-weight="bold">Schrödinger eq.</text>

  <line x1="404" y1="159" x2="441" y2="159" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr-fwd)"/>
  <text x="423" y="92" text-anchor="middle" font-size="11.5" fill="#2c3e50" font-weight="bold">Contraction</text>

  <!-- Inverse HK arrow underneath -->
  <path d="M 528,216 C 528,284 112,284 112,220" fill="none" stroke="#a0522d" stroke-width="2.8" marker-end="url(#arr-inv)"/>
  <line x1="320" y1="266" x2="320" y2="220" stroke="#a0522d" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arr-inv)"/>

  <!-- Pill label on bottom curve -->
  <rect x="208" y="253" width="224" height="24" rx="12" fill="#fafaf8" stroke="#a0522d" stroke-width="1.4"/>
  <text x="320" y="269" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0522d">First HK Theorem (unique inverse)</text>

  <!-- Bottom takeaway box -->
  <rect x="30" y="304" width="580" height="54" rx="8" fill="#a0522d" fill-opacity="0.09" stroke="#a0522d" stroke-width="1.3"/>
  <text x="320" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c2c2c">ρ<tspan font-size="9.5" dy="3">0</tspan><tspan dy="-3">(r)  ↦  V</tspan><tspan font-size="9.5" dy="3">ext</tspan><tspan dy="-3">(r) + const.  ↦  |Ψ</tspan><tspan font-size="9.5" dy="3">0</tspan><tspan dy="-3">[ρ</tspan><tspan font-size="9.5" dy="3">0</tspan><tspan dy="-3">]⟩</tspan></text>
  <text x="320" y="346" text-anchor="middle" font-size="12" fill="#555">Every ground-state observable O[ρ<tspan font-size="8.5" dy="2">0</tspan><tspan dy="-2">] = ⟨Ψ</tspan><tspan font-size="8.5" dy="2">0</tspan><tspan dy="-2">[ρ</tspan><tspan font-size="8.5" dy="2">0</tspan><tspan dy="-2">]|Ô|Ψ</tspan><tspan font-size="8.5" dy="2">0</tspan><tspan dy="-2">[ρ</tspan><tspan font-size="8.5" dy="2">0</tspan><tspan dy="-2">]⟩ is uniquely determined by the 3D density</tspan></text>

</svg>
