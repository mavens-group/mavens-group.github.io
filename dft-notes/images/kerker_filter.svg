<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="Georgia, 'Times New Roman', serif" xml:space="preserve">

  <rect width="640" height="420" fill="#fafaf8"/>

  <defs>
    <marker id="ax-k" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#444"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c2c2c">Metallic Charge Sloshing and the Kerker Filter</text>
  <text x="320" y="49" text-anchor="middle" font-size="12" fill="#555" font-style="italic">Reciprocal-space preconditioning damps divergent small-G modes while preserving short-range updates</text>

  <!-- Shaded sloshing zone G < k_0 (x=86..206) -->
  <rect x="86" y="96" width="120" height="224" fill="#a0522d" fill-opacity="0.11"/>
  <text x="146" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0522d">Sloshing zone</text>
  <text x="146" y="138" text-anchor="middle" font-size="11.5" fill="#a0522d">(G &lt; k<tspan font-size="8.5" dy="2">0</tspan><tspan dy="-2">)</tspan></text>
  <text x="146" y="158" text-anchor="middle" font-size="11" fill="#884020" font-style="italic">ε(G) → ∞</text>

  <!-- High-G unscreened regime -->
  <rect x="206" y="96" width="368" height="224" fill="#6a9e7a" fill-opacity="0.06"/>
  <text x="415" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#436e50">Short-wavelength regime (G ≫ k<tspan font-size="8.5" dy="2">0</tspan><tspan dy="-2">)</tspan></text>

  <!-- Asymptote K = 1.0 -->
  <line x1="86" y1="96" x2="574" y2="96" stroke="#6a9e7a" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="78" y="100" text-anchor="end" font-size="12" fill="#444">1.0</text>

  <!-- Halfway mark K = 0.5 at G = k_0 (x=206, y=208) -->
  <line x1="86" y1="208" x2="206" y2="208" stroke="#b8963e" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="206" y1="96" x2="206" y2="320" stroke="#b8963e" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="78" y="212" text-anchor="end" font-size="12" fill="#8a6a1a">0.5</text>

  <!-- Axes -->
  <line x1="78" y1="320" x2="588" y2="320" stroke="#444" stroke-width="1.6" marker-end="url(#ax-k)"/>
  <line x1="86" y1="328" x2="86" y2="70" stroke="#444" stroke-width="1.6" marker-end="url(#ax-k)"/>
  <text x="595" y="324" font-size="13.5" fill="#444" font-style="italic">G / k<tspan font-size="9.5" dy="3" font-style="normal">0</tspan></text>
  <text x="76" y="73" text-anchor="end" font-size="13" fill="#444" font-weight="bold">K(G)</text>

  <!-- X ticks -->
  <text x="86" y="338" text-anchor="middle" font-size="12" fill="#444">0</text>
  <text x="206" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a1a">1  (k<tspan font-size="8.5" dy="2">0</tspan><tspan dy="-2">)</tspan></text>
  <text x="326" y="338" text-anchor="middle" font-size="12" fill="#444">2</text>
  <text x="446" y="338" text-anchor="middle" font-size="12" fill="#444">3</text>
  <text x="566" y="338" text-anchor="middle" font-size="12" fill="#444">4</text>

  <!-- Kerker curve: y = 320 - 224 * u^2 / (u^2 + 1) -->
  <path d="M 86,320 C 110,316 128,296 146,275.2 C 168,249.5 186,225 206,208 C 228,188.5 246,175 266,164.9 C 292,151.6 310,145.5 326,140.8 C 358,132.3 410,122.2 446,118.4 C 490,113.8 530,111 566,109.2"
        fill="none" stroke="#4a7fa5" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Point at G=k_0 -->
  <circle cx="206" cy="208" r="4.5" fill="#8a6a1a"/>
  <text x="220" y="222" font-size="12" font-weight="bold" fill="#2a5f85">K(k<tspan font-size="8.5" dy="2">0</tspan><tspan dy="-2">) = 0.5</tspan></text>

  <!-- Curve label -->
  <text x="415" y="182" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2a5f85">K(G) = G<tspan font-size="9.5" dy="-4">2</tspan><tspan dy="4"> / (G</tspan><tspan font-size="9.5" dy="-4">2</tspan><tspan dy="4"> + k</tspan><tspan font-size="9.5" dy="3">0</tspan><tspan font-size="9.5" dy="-7">2</tspan><tspan dy="4">)</tspan></text>

  <!-- Bottom summary box -->
  <rect x="64" y="356" width="532" height="48" rx="6" fill="#4a7fa5" fill-opacity="0.10" stroke="#4a7fa5" stroke-width="1.3"/>
  <text x="330" y="376" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c2c2c">Preconditioned update:  R̃(G) = K(G) R(G)   (typically k<tspan font-size="9" dy="2">0</tspan><tspan dy="-2"> ≈ k</tspan><tspan font-size="9" dy="2">TF</tspan><tspan dy="-2"> ~ 1.0–1.5 Å</tspan><tspan font-size="9" dy="-3">−1</tspan><tspan dy="3">)</tspan></text>
  <text x="330" y="394" text-anchor="middle" font-size="11.5" fill="#555">Cancels the 1/G<tspan font-size="8.5" dy="-3">2</tspan><tspan dy="3"> Lindhard dielectric divergence as G → 0, restoring uniform SCF convergence</tspan></text>

</svg>
