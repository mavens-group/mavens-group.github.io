<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 128 128"
   width="128"
   height="128"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Ptbl: Stepped Periodic Table (Squarish 90x90) -->
  <g
     id="ptbl">
    <!-- s-block, with hydrogen above the outer column -->
    <path
       fill="#059669"
       d="M 19,19 L 31,19 L 31,34 L 43,34 L 43,84 L 19,84 Z"
       id="s_block" />
    <!-- p-block, with helium above the outer column -->
    <path
       fill="#34D399"
       d="M 109,19 L 97,19 L 97,34 L 83,34 L 83,84 L 109,84 Z"
       id="p_block" />
    <!-- d-block, recessed from period 4 -->
    <path
       fill="#047857"
       d="M 47,52 L 79,52 L 79,84 L 47,84 Z"
       id="d_block" />
    <!-- f-block, detached and offset right as in the full table -->
    <path
       fill="#34D399"
       d="M 47,88 L 109,88 L 109,109 L 47,109 Z"
       id="f_block" />
  </g>
</svg>
