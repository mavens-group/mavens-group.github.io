<svg viewBox="0 0 128 128" width="128" height="128" xmlns="http://www.w3.org/2000/svg" version="1.1">
  <style>
    :root, svg {
      color: #24292f;
    }
    .primary {
      fill: currentColor;
    }
    .secondary {
      fill: currentColor;
      opacity: 0.65;
    }
    .tertiary {
      fill: currentColor;
      opacity: 0.85;
    }
    .stroke-primary {
      stroke: currentColor;
      fill: none;
    }
    @media (prefers-color-scheme: dark) {
      :root, svg {
        color: #ffffff;
      }
      .secondary {
        opacity: 0.70;
      }
      .tertiary {
        opacity: 0.88;
      }
    }
  </style>
  <!-- MAVENs: Crystalline Monogram (Squarish 90x90) -->
    <g id="mavens">
      <rect class='primary' x="19" y="19" width="18" height="90" rx="2" />
      <rect class='primary' x="91" y="19" width="18" height="90" rx="2" />
      <polygon class='secondary' points="40.5,19 62,64 62,91 40.5,46" />
      <polygon class='tertiary' points="87.5,19 66,64 66,91 87.5,46" />
    </g>
</svg>