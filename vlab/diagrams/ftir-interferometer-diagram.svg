<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <rect width="600" height="350" fill="#ffffff"/>
  
  <!-- Components -->
  <rect x="50" y="150" width="60" height="40" fill="#ffc107" stroke="#d39e00" stroke-width="2"/>
  <text x="80" y="210" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">IR Source</text>
  
  <rect x="290" y="50" width="80" height="20" fill="#6c757d" stroke="#343a40" stroke-width="2"/>
  <text x="330" y="40" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">Fixed Mirror</text>
  
  <rect x="480" y="140" width="20" height="80" fill="#007bff" stroke="#0056b3" stroke-width="2"/>
  <text x="490" y="240" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">Moving Mirror</text>
  <path d="M 510 160 L 530 160 M 510 180 L 530 180" stroke="#007bff" stroke-width="2" marker-end="url(#arrow)"/>
  
  <polygon points="320,130 340,150 320,170 300,150" fill="#17a2b8" stroke="#117a8b" stroke-width="2"/>
  <text x="350" y="190" font-family="sans-serif" font-size="14" fill="#333">Beam Splitter</text>
  
  <rect x="300" y="270" width="40" height="40" fill="#28a745" stroke="#1e7e34" stroke-width="2"/>
  <text x="320" y="330" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">Detector</text>

  <!-- IR Beams -->
  <line x1="110" y1="170" x2="300" y2="170" stroke="#dc3545" stroke-width="3" stroke-dasharray="5"/>
  <line x1="320" y1="170" x2="480" y2="170" stroke="#dc3545" stroke-width="3" stroke-dasharray="5"/>
  <line x1="480" y1="175" x2="320" y2="175" stroke="#dc3545" stroke-width="3" stroke-dasharray="5"/>
  <line x1="320" y1="150" x2="320" y2="70" stroke="#dc3545" stroke-width="3" stroke-dasharray="5"/>
  <line x1="325" y1="70" x2="325" y2="150" stroke="#dc3545" stroke-width="3" stroke-dasharray="5"/>
  <line x1="320" y1="170" x2="320" y2="270" stroke="#dc3545" stroke-width="3" stroke-dasharray="5" marker-end="url(#arrow-red)"/>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#007bff"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc3545"/>
    </marker>
  </defs>
</svg>
