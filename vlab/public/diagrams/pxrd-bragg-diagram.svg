<svg viewBox="0 0 540 260" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c" />
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155" />
    </marker>
  </defs>

  <rect x="0" y="0" width="540" height="260" fill="#ffffff" rx="12" />

  <!-- lattice planes -->
  <line x1="60" y1="110" x2="480" y2="110" stroke="#334155" stroke-width="2" />
  <line x1="60" y1="215" x2="480" y2="215" stroke="#334155" stroke-width="2" />
  <text x="55" y="114" text-anchor="end" font-size="13" fill="#334155">Plane 1</text>
  <text x="55" y="219" text-anchor="end" font-size="13" fill="#334155">Plane 2</text>

  <!-- atoms -->
  <g fill="#1d4ed8">
    <circle cx="95" cy="110" r="4.5" />
    <circle cx="200" cy="110" r="4.5" />
    <circle cx="305" cy="110" r="4.5" />
    <circle cx="410" cy="110" r="4.5" />
    <circle cx="95" cy="215" r="4.5" />
    <circle cx="200" cy="215" r="4.5" />
    <circle cx="305" cy="215" r="4.5" />
    <circle cx="410" cy="215" r="4.5" />
  </g>

  <!-- incident / diffracted rays -->
  <line x1="60" y1="29" x2="190" y2="104" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)" />
  <line x1="25" y1="114" x2="294" y2="209" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)" />
  <line x1="209" y1="104" x2="338" y2="30" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)" />
  <line x1="316" y1="209" x2="443" y2="136" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)" />

  <!-- extra path-length construction line -->
  <line x1="200" y1="110" x2="317" y2="177" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- angle arcs -->
  <path d="M 256 110 A 56 56 0 0 0 248 82" fill="none" stroke="#334155" stroke-width="1.5" />
  <path d="M 144 110 A 56 56 0 0 1 151 82" fill="none" stroke="#334155" stroke-width="1.5" />
  <path d="M 284 63 A 66 66 0 0 1 284 152" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="270" y="97" font-size="15" font-style="italic" fill="#0f172a">&#952;</text>
  <text x="128" y="97" font-size="15" font-style="italic" fill="#0f172a">&#952;</text>
  <text x="315" y="112" font-size="15" font-style="italic" fill="#0f172a">2&#952;</text>

  <!-- d_hkl spacing -->
  <line x1="20" y1="113" x2="20" y2="212" stroke="#0f172a" stroke-width="1.5" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)" />
  <text x="30" y="167" font-size="14" font-style="italic" fill="#0f172a">d</text>
  <text x="38" y="171" font-size="9" fill="#0f172a">hkl</text>

  <text x="270" y="245" text-anchor="middle" font-size="13" fill="#475569" font-style="italic">
    Bragg diffraction: incident angle &#952;, diffraction angle 2&#952;, plane spacing d_hkl
  </text>
</svg>
